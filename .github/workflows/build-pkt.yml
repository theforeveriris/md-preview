name: Build PKT Topologies

on:
  push:
    paths:
      - 'iris/data/pkt/raw/**'
      - 'iris/scripts/pkt/**'
      - '.github/workflows/build-pkt.yml'
  workflow_dispatch:

# 回写 main 的最小权限（此前缺省吃到仓库默认 token 权限）
permissions:
  contents: write

concurrency:
  group: build-pkt
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Process .pkt files
        # --force：fresh checkout 下 git 不保留原始 mtime，增量对比失效，
        # 触发本次构建的 .pkt 会被误判为最新而跳过，因此 CI 必须全量重建
        run: python iris/scripts/pkt/main.py --force --verbose

      - name: Commit generated JSON/XML
        uses: ./.github/actions/commit-with-retry
        with:
          message: 'chore(pkt): 自动构建拓扑 JSON/XML [skip ci]'
          files: 'iris/data/pkt/xml/ iris/data/pkt/json/'
