name: Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # sitemap / feed 读取文件提交时间

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # npm 缓存：jsdom 安装不再每次全量下载
        cache: npm
        cache-dependency-path: iris/package-lock.json

    # 构建脚本清单与 deploy 共用 composite action（避免两份列表漂移）
    - name: Build site data
      uses: ./.github/actions/build-data

    - name: Install jsdom (smoke test only)
      working-directory: iris
      # 固定精确版本（此前裸 --no-save 装最新 ^29，行为可能漂移）；
      # 只装 jsdom 一个包（npm ci 会连带装全部运行时依赖，过重）
      run: npm install --no-save --no-audit --no-fund jsdom@29.1.1

    # npm test = smoke（结构/产物/i18n 双语/索引内容）+ unit（slug 一致性 /
    # 文件树排序 / 渲染管线端到端）+ cm6 全套 —— 此前三组散落无统一入口
    - name: Run tests (smoke + unit + cm6)
      run: npm test

    - name: CJK typography lint (advisory; dedicated workflow is authoritative)
      continue-on-error: true
      run: node iris/scripts/lint-cjk.js --quiet

    - name: Run link check (internal full + external daily sample)
      run: node iris/scripts/link-check.js

    - name: Validate CodeRabbit config (schema + path filters)
      if: hashFiles('.coderabbit.yaml') != ''
      run: |
        python3 -m pip install --quiet --disable-pip-version-check pyyaml
        python3 iris/scripts/validate-coderabbit.py
        python3 iris/scripts/check-coderabbit-paths.py

