name: Desktop Release

# 桌面端发布流水线：打 tag（v*）触发，构建 Windows 安装包 + 自动更新签名
# 产物（latest.json），上传到 GitHub Release——tauri.conf.json 里 updater
# endpoint 指向的正是本 job 产出的 latest/latest.json。
#
# 首次启用需一次性配置（缺任一项本 job 会在校验步骤失败并给出提示）：
#   1. 生成签名密钥对：
#        pnpm tauri signer generate -w ~/.tauri/md-preview.key
#   2. 仓库 Settings → Secrets and variables → Actions 配置：
#        TAURI_SIGNING_PRIVATE_KEY          （私钥文件内容）
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD （生成时设置的口令，可为空串）
#   3. 把公钥内容更新进 src-tauri/tauri.conf.json 的 plugins.updater.pubkey
#      （当前是占位空钥，更新检查会一直失败）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    # 手动运行也必须针对版本 tag（分支运行在下方校验步骤被拒绝）——
    # 否则 ref_name 是分支名，Release 会建成 "main" 并可能成为 updater 的 latest

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Verify version tag ref
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::手动运行必须针对 v* 版本 tag（在 Run workflow 面板选择 tag），当前 ref: ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Verify signing secrets present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY Secret（配置步骤见本 workflow 文件头部说明）"
            exit 1
          fi

      # 本地开发构建保持 createUpdaterArtifacts:false（无需签名密钥）；
      # 发布构建经 --config 临时开启，产出 latest.json 与 .sig 签名文件。
      # 第三方 action 按安全基线固定到完整 commit SHA（SHA 与注释同步维护）
      - name: Build desktop app and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'md-preview ${{ github.ref_name }}'
          releaseBody: '桌面端安装包与自动更新签名产物（latest.json / *.sig）。'
          releaseDraft: false
          prerelease: false
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
