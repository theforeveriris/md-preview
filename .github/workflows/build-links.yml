name: Build Links Data

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build links data (graph / backlinks)
      run: node iris/scripts/build-links.js

    - name: Commit and push changes
      uses: EndBug/add-and-commit@v9
      with:
        message: 'build: update links.json'
        add: 'iris/data/links.json'
        default_author: github_actions
        # 多个工作流会同时向 main 推送，先 rebase 远端再推，
        # 否则后推的那个会被 non-fast-forward 拒绝。
        pull: '--rebase'
        push: 'origin HEAD:refs/heads/${{ github.ref_name }} --force-with-lease'
