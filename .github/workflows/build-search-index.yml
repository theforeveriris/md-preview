name: Build Search Index

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: build-search-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Build search index
      run: node iris/scripts/build-search-index.js
      
    # 弃用 EndBug/add-and-commit（唯一残留的使用方）：第三方 action、无 rebase
    # 重试，与 feed/links/cjk 并发时最易被拒。统一走 composite action。
    - name: Commit and push changes
      uses: ./.github/actions/commit-with-retry
      with:
        message: 'build: update search-index.json'
        files: 'iris/data/search-index.json'
