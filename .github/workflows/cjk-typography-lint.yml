name: CJK Typography Lint

# 中文文案排版校验（参考《中文文案排版指北》）
# - 首次运行：全量检查仓库内所有 Markdown
# - 之后运行：增量检查自上次基线以来改动的 Markdown
# - main 分支上由机器人提交自动修正；PR 上只提示，不写回

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'
  schedule:
    # 每周一次全量巡检
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      force_full:
        description: '强制全量检查（忽略基线）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cjk-typography-lint-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_TAG: cjk-lint-baseline

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0  # 需要完整历史与 tag 以计算增量范围

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    - name: Fetch baseline tag
      run: |
        git fetch --force --tags origin
        git fetch origin "+refs/tags/${BASE_TAG}:refs/tags/${BASE_TAG}" || true
        if git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
          echo "基线存在：$(git rev-list -n 1 ${BASE_TAG})"
        else
          echo "基线不存在，本次将执行全量检查"
        fi

    - name: Prepare check list (full first run, incremental afterwards)
      id: prepare
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        ARGS=""
        if [ "${{ inputs.force_full }}" = "true" ]; then ARGS="--force-full"; fi
        if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
          export CJK_LINT_BASE_COMMIT="$PR_BASE_SHA"
        fi
        node iris/scripts/cjk-lint-ci.js prepare $ARGS --out .cjk-lint-files.txt | tee .cjk-lint-mode.txt
        {
          echo "mode=$(sed -n 's/^mode=//p' .cjk-lint-mode.txt)"
          echo "files=$(sed -n 's/^files=//p' .cjk-lint-mode.txt)"
          echo "base=$(sed -n 's/^base=//p' .cjk-lint-mode.txt)"
        } >> "$GITHUB_OUTPUT"

    - name: Report mode
      run: |
        echo "检查模式：${{ steps.prepare.outputs.mode }}"
        echo "基线：${{ steps.prepare.outputs.base }}"
        echo "待检查文件数：${{ steps.prepare.outputs.files }}"
        cat .cjk-lint-files.txt

    # main 分支：自动修复（lint-cjk.js 内部先修复再复检）
    # exit 码含义：
    #   0 = 全部问题都已自动修复（或原本就干净）
    #   1 = 仍有无法自动修复的问题（如行首禁则、中文旁直引号）——只提示，不阻断
    - name: Auto-fix CJK typography issues
      if: github.event_name != 'pull_request'
      id: fix
      run: |
        set +e
        node iris/scripts/lint-cjk.js --files-from .cjk-lint-files.txt --fix
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        exit 0

    # PR：只报告问题，不改写仓库
    - name: Check (pull request, report only)
      if: github.event_name == 'pull_request'
      id: check
      run: |
        set +e
        node iris/scripts/lint-cjk.js --files-from .cjk-lint-files.txt
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        exit 0

    # main 分支：机器人提交修正
    #
    # 自己实现提交与推送，而不是用 EndBug/add-and-commit，原因：
    #   1) 该动作的执行顺序是 add → pull → commit → push。只要暂存了改动，
    #      随后的 `git pull --rebase` 就会报
    #      "cannot pull with rebase: Your index contains uncommitted changes"；
    #   2) 它的 add 输入是 shell 通配符语义，add: '*.md' 只会匹配根目录的 .md，
    #      嵌套目录（docs/zw/*.md）的修正会被漏掉；add: '.' 又会误伤其它工作流的产物。
    #
    # 这里的做法：先在本工作区提交，再循环「拉取远端 + rebase + 推送」，
    # 处理多个工作流同时向 main 推送的竞态。
    # 提交+rebase 重试统一走 composite action（changed 输出供后续步骤使用）
    - name: Commit and push changes
      if: github.event_name != 'pull_request'
      id: commit
      uses: ./.github/actions/commit-with-retry
      with:
        message: 'style: 中文排版自动修正 [skip ci]'
    # PR：只报告问题，不改写仓库
    - name: Check (pull request, report only)
      if: github.event_name == 'pull_request'
      id: check
      run: |
        set +e
        node iris/scripts/lint-cjk.js --files-from .cjk-lint-files.txt
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        exit 0

    # main 分支：机器人提交修正
    #
    # 自己实现提交与推送，而不是用 EndBug/add-and-commit，原因：
    #   1) 该动作的执行顺序是 add → pull → commit → push。只要暂存了改动，
    #      随后的 `git pull --rebase` 就会报
    #      "cannot pull with rebase: Your index contains uncommitted changes"；
    #   2) 它的 add 输入是 shell 通配符语义，add: '*.md' 只会匹配根目录的 .md，
    #      嵌套目录（docs/zw/*.md）的修正会被漏掉；add: '.' 又会误伤其它工作流的产物。
    #
    # 这里的做法：先在本工作区提交，再循环「拉取远端 + rebase + 推送」，
    # 处理多个工作流同时向 main 推送的竞态。
    - name: Commit and push changes
      if: github.event_name != 'pull_request'
      id: commit
      run: |
        set +e
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        # 暂存本次实际改动的文件
        # 用 core.quotePath=false 保证中文文件名不被转义（否则路径是转义串，add 不到）
        CHANGED=$(git -c core.quotePath=false diff --name-only)
        if [ -n "$CHANGED" ]; then
          git add -- $CHANGED
        fi
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "无需修正，跳过提交"
          exit 0
        fi
        git commit -m 'style: 中文排版自动修正 [skip ci]' \
                  -m '由 CJK Typography Lint 工作流自动修复，遵循《中文文案排版指北》。'
        # 推送重试：多个工作流会同时向 main 推送，
        # 被 non-fast-forward 拒绝时先 rebase 远端再推
        for i in 1 2 3 4 5; do
          if git push origin "HEAD:refs/heads/${{ github.ref_name }}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "推送被拒（第 $i 次），rebase 远端后重试..."
          git fetch origin "${{ github.ref_name }}"
          # 变基到远端最新提交之上；冲突时中止（排版修正与他人改动冲突概率极低）
          git rebase "origin/${{ github.ref_name }}" || {
            echo "::error::rebase 冲突，请手动处理"
            git rebase --abort
            exit 1
          }
        done
        echo "changed=false" >> "$GITHUB_OUTPUT"
        echo "::warning::修正已提交但多次推送失败，请手动处理"
        exit 0

    # PR：只提示，不写回仓库
    - name: Report issues on pull request
      if: github.event_name == 'pull_request'
      run: |
        rm -f .cjk-lint-files.txt .cjk-lint-mode.txt
        echo "中文排版检查完成（PR 模式：仅提示，不自动改写）"

    # 清理临时文件（放在提交之后，避免被 add-and-commit 带进提交）
    - name: Cleanup temp files
      if: always()
      run: rm -f .cjk-lint-files.txt .cjk-lint-mode.txt

    # 推进基线：后续运行改为增量检查（指向修复提交后的 main）
    - name: Advance baseline tag
      if: github.event_name != 'pull_request' && steps.fix.outputs.exit == '0'
      run: |
        git fetch origin main
        node iris/scripts/cjk-lint-ci.js advance

    # 门禁：仍有「本该被自动修掉却还在」的问题时失败。
    # 需人工处理的问题（行首禁则 / 直引号等）只报告不阻断 ——
    # 它们的退出码是 0（lint-cjk.js 只对可自动修复的残留报错）。
    - name: Enforce clean typography
      if: >-
        (github.event_name != 'pull_request' && steps.fix.outputs.exit != '0') ||
        (github.event_name == 'pull_request' && steps.check.outputs.exit != '0')
      run: |
        echo "::error::仍有中文排版问题未能自动修复，请手动处理后重新提交。"
        exit 1
