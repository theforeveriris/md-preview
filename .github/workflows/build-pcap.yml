name: Build PCAP Packets

on:
  push:
    branches:
      - main
    paths:
      - 'iris/data/pcap/raw/**'
      - 'iris/scripts/pcap/**'
      - '.github/workflows/build-pcap.yml'
  workflow_dispatch:

# 回写 main 的最小权限
permissions:
  contents: write

concurrency:
  group: build-pcap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install parser backend
        run: pip install scapy

      - name: Process .pcap files
        # 与 build-pkt 同理：fresh checkout 无原始 mtime，增量对比失效，必须全量
        run: python iris/scripts/pcap/main.py --force --verbose

      - name: Commit generated JSON
        uses: ./.github/actions/commit-with-retry
        with:
          message: 'chore(pcap): 自动构建抓包 JSON [skip ci]'
          files: 'iris/data/pcap/json/'
