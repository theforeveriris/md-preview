name: Build PPTX Thumbnails

on:
  push:
    paths:
      - 'iris/data/pptx/raw/**'
      - 'iris/scripts/pptx/**'
      - '.github/workflows/build-pptx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreOffice + Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress \
            libreoffice-java-common \
            poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-pptx Pillow

      - name: Process .ppt/.pptx files
        run: python iris/scripts/pptx/main.py --verbose

      - name: Commit generated JSON + images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add iris/data/pptx/images/ iris/data/pptx/json/
          if git diff --staged --quiet; then
            echo '无需提交：images/json 已是最新'
          else
            git commit -m 'chore(pptx): 自动构建 PPT 缩略图与元数据 [skip ci]'
            git push
          fi
